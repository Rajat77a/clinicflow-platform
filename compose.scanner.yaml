services:
  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    volumes:
      - clamav-database:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  document-scanner:
    build:
      context: workers/document-scanner
    depends_on:
      clamav:
        condition: service_healthy
    environment:
      CLAMD_HOST: clamav
      CLAMD_PORT: "3310"
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:?required}
      SUPABASE_URL: ${SUPABASE_URL:?required}
    read_only: true
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777

volumes:
  clamav-database:
