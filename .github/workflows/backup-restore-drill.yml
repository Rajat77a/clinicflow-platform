name: Backup restore drill

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/backup-restore-drill.yml"
      - "supabase/migrations/**"
      - "supabase/seed.sql"
      - "supabase/tests/**"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-restore-drill-${{ github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-restore:
    name: Restore synthetic database backup
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install --yes postgresql-client

      - name: Start clean synthetic Supabase stack
        run: supabase start

      - name: Dump, restore, and verify synthetic application data
        shell: bash
        run: |
          set -euo pipefail
          backup_file="$RUNNER_TEMP/clinicflow-synthetic-backup.sql"
          trap 'rm -f "$backup_file"' EXIT

          eval "$(supabase status -o env)"
          before="$(psql "$DB_URL" -Atc \
            "select count(*) from public.hospitals")"

          supabase db dump --local --data-only --schema public \
            --file "$backup_file"
          test -s "$backup_file"

          supabase db reset --local --no-seed
          eval "$(supabase status -o env)"
          psql "$DB_URL" --set ON_ERROR_STOP=1 --file "$backup_file"

          after="$(psql "$DB_URL" -Atc \
            "select count(*) from public.hospitals")"
          test "$before" = "$after"
          supabase test db

          echo "Synthetic backup restored and database security tests passed."

      - name: Confirm no backup artifact remains
        if: always()
        run: test ! -e "$RUNNER_TEMP/clinicflow-synthetic-backup.sql"
