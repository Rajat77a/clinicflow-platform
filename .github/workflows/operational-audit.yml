name: Protected operational audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: protected-operational-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: hospital-production

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit protected production dependencies
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OPS_MAX_QUEUE_DEPTH: "100"
          OPS_MAX_OLDEST_AGE_SECONDS: "900"
        run: node scripts/operational-audit.mjs
