name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Test, typecheck, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests
        run: bun run test

      - name: Scan tracked files for secrets
        run: bun run security:secrets

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Start isolated Supabase test backend
        run: supabase start

      - name: Seed synthetic portal identities
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          echo "VITE_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "VITE_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "VITE_CLINICFLOW_APP_URL=http://127.0.0.1:4173" >> "$GITHUB_ENV"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          bun scripts/integration/seed-e2e.mjs

      - name: Run portal end-to-end tests
        run: bun run test:e2e

      - name: Report local backend diagnostics
        if: failure()
        run: supabase status

      - name: Run typecheck
        run: bun run typecheck

      - name: Run lint
        run: bunx eslint . --quiet

      - name: Build production bundle
        run: bun run build

      - name: Build portable container
        run: docker build --tag clinicflow:${{ github.sha }} .
