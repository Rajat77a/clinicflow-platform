name: Production performance

on:
  schedule:
    - cron: "41 3 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-performance
  cancel-in-progress: true

jobs:
  bounded-load-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run bounded production load check
        env:
          BASE_URL: https://clinicflow-platform.vercel.app
          LOAD_REQUESTS: "80"
          LOAD_CONCURRENCY: "4"
          LOAD_P95_MS: "3000"
          LOAD_MAX_ERROR_RATE: "0.01"
        run: node scripts/load-smoke.mjs
