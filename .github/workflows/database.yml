name: Database

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/database.yml"
      - "bun.lock"
      - "package.json"
      - "scripts/integration/**"
      - "supabase/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/database.yml"
      - "bun.lock"
      - "package.json"
      - "scripts/integration/**"
      - "supabase/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Replay migrations and test database security
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.110.0

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install application dependencies
        run: bun install --frozen-lockfile

      - name: Start clean Supabase stack
        run: supabase start

      - name: Run database security tests
        run: supabase test db

      - name: Run cross-portal database integration tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          SUPABASE_URL="$API_URL" \
          SUPABASE_ANON_KEY="$ANON_KEY" \
          SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY" \
          SUPABASE_DB_URL="$DB_URL" \
          bun run test:integration:db

      - name: Report Realtime diagnostics
        if: failure()
        run: |
          docker ps --all --filter name=supabase_realtime
          docker ps --all --quiet --filter name=supabase_realtime \
            | xargs --no-run-if-empty docker logs --tail 250

      - name: Reject database lint errors
        run: supabase db lint --local --level error
