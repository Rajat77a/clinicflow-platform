name: Production smoke

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Check production health and security
        env:
          BASE_URL: https://clinicflow-platform.vercel.app
          SUPABASE_FUNCTION_URL: https://lwdzykeyiuohkfhdlyua.supabase.co/functions/v1/invite-staff
        run: node scripts/smoke.mjs
